<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergências Pediátricas - Estudo TAS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<header>
    <div class="logo">

        <img src="assets/logo.png" alt="Logo">

        <h2>Estudo <span>TAS</span></h2>

    </div>
</header>

<main>
    <!-- ===== BREADCRUMB ===== -->
    <div class="breadcrumb">
        <a href="index.html"><i class="fa-solid fa-house"></i> Início</a>
        <span class="separator">/</span>
        <span class="current">Emergências Pediátricas</span>
    </div>

    <!-- ===== HEADER DO MANUAL ===== -->
    <div class="manual-header">
        <div class="header-content">
            <div class="header-icon">
                <i class="fa-solid fa-baby"></i>
            </div>
            <div>
                <h1>Emergências Pediátricas</h1>
                <p class="manual-subtitle"><i class="fa-regular fa-file-lines"></i> Abordagem e atuação em situações de emergência com crianças.</p>
                <div class="header-meta">
                    <span><i class="fa-regular fa-circle-check"></i> 11 capítulos</span>
                    <span><i class="fa-regular fa-clock"></i> Manual TAS</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== TABS (CAPÍTULOS) ===== -->
    <div class="tabs-wrapper" id="tabsWrapper">
        <div class="tabs-header">
            <div class="tabs-scroll-indicators left"></div>
            <div class="tabs-scroll-indicators right"></div>
            <div class="tabs-container" id="tabsContainer">
                <button class="tab-btn active" data-chapter="1">
                    <span class="tab-icon"><i class="fa-solid fa-1"></i></span>
                    <span class="tab-label">Introdução</span>
                    <span class="tab-badge">I</span>
                </button>
                <button class="tab-btn" data-chapter="2">
                    <span class="tab-icon"><i class="fa-solid fa-2"></i></span>
                    <span class="tab-label">Abordagem Pediátrica</span>
                    <span class="tab-badge">II</span>
                </button>
                <button class="tab-btn" data-chapter="3">
                    <span class="tab-icon"><i class="fa-solid fa-3"></i></span>
                    <span class="tab-label">Alergia</span>
                    <span class="tab-badge">III</span>
                </button>
                <button class="tab-btn" data-chapter="4">
                    <span class="tab-icon"><i class="fa-solid fa-4"></i></span>
                    <span class="tab-label">Emerg. Respiratórias</span>
                    <span class="tab-badge">IV</span>
                </button>
                <button class="tab-btn" data-chapter="5">
                    <span class="tab-icon"><i class="fa-solid fa-5"></i></span>
                    <span class="tab-label">Desidratação</span>
                    <span class="tab-badge">V</span>
                </button>
                <button class="tab-btn" data-chapter="6">
                    <span class="tab-icon"><i class="fa-solid fa-6"></i></span>
                    <span class="tab-label">Febre</span>
                    <span class="tab-badge">VI</span>
                </button>
                <button class="tab-btn" data-chapter="7">
                    <span class="tab-icon"><i class="fa-solid fa-7"></i></span>
                    <span class="tab-label">Convulsão</span>
                    <span class="tab-badge">VII</span>
                </button>
                <button class="tab-btn" data-chapter="8">
                    <span class="tab-icon"><i class="fa-solid fa-8"></i></span>
                    <span class="tab-label">Sépsis Meningocócica</span>
                    <span class="tab-badge">VIII</span>
                </button>
                <button class="tab-btn" data-chapter="9">
                    <span class="tab-icon"><i class="fa-solid fa-9"></i></span>
                    <span class="tab-label">Hipoglicemia</span>
                    <span class="tab-badge">IX</span>
                </button>
                <button class="tab-btn" data-chapter="10">
                    <span class="tab-icon"><i class="fa-solid fa-10"></i></span>
                    <span class="tab-label">Intoxicação</span>
                    <span class="tab-badge">X</span>
                </button>
                <button class="tab-btn" data-chapter="11">
                    <span class="tab-icon"><i class="fa-solid fa-11"></i></span>
                    <span class="tab-label">Reanimação</span>
                    <span class="tab-badge">XI</span>
                </button>
            </div>
            <div class="tabs-nav-arrows left">
                <button class="nav-arrow" id="scrollLeft"><i class="fa-solid fa-chevron-left"></i></button>
            </div>
            <div class="tabs-nav-arrows">
                <button class="nav-arrow" id="scrollRight"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- ===== CONTEÚDO DO CAPÍTULO ===== -->
    <div class="chapter-content-wrapper">
        <div class="chapter-content" id="chapterContent">
            <!-- Injetado pelo JavaScript -->
        </div>
    </div>
</main>

<footer class="page-footer">
    <div class="footer-content">
        <p><i class="fa-regular fa-copyright"></i> Estudo TAS - Material de apoio à formação</p>
        <div class="footer-links">
            <span>INEM</span>
            <span>•</span>
            <span>SIEM</span>
            <span>•</span>
            <span>Emergência Médica</span>
        </div>
    </div>
</footer>

<script src="js/EP.js"></script>
</body>
</html>
