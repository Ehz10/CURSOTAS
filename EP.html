<!-- emergencias_pediatricas.html - Versão melhorada -->
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergências Pediátricas - Estudo TAS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-icon pulse-icon">
            <img src="assets/logo.png" alt="Logo">
        </div>
        <h2>Estudo <span>TAS</span></h2>
    </div>
    <div class="header-status">
        <span class="status-dot"></span>
        <span class="status-text">Manual disponível</span>
    </div>
</header>

<main>
    <!-- ===== BREADCRUMB ===== -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html"><i class="fa-solid fa-house"></i> Início</a>
        <span class="separator">/</span>
        <span class="current">Emergências Pediátricas</span>
        <span class="breadcrumb-progress">Capítulo 1 de 11</span>
    </nav>

    <!-- ===== HEADER DO MANUAL ===== -->
    <div class="manual-header">
        <div class="header-content">
            <div class="header-icon float-icon">
                <i class="fa-solid fa-baby"></i>
            </div>
            <div>
                <div class="header-badge">Manual TAS</div>
                <h1>Emergências Pediátricas</h1>
                <p class="manual-subtitle"><i class="fa-regular fa-file-lines"></i> Abordagem e atuação em situações de emergência com crianças.</p>
                <div class="header-meta">
                    <span><i class="fa-regular fa-circle-check"></i> 11 capítulos</span>
                    <span><i class="fa-regular fa-clock"></i> Última atualização: 2024</span>
                    <span><i class="fa-regular fa-bookmark"></i> INEM</span>
                </div>
            </div>
        </div>
        <div class="header-decoration">
            <div class="decoration-bar"></div>
        </div>
    </div>

    <!-- ===== TABS (CAPÍTULOS) ===== -->
    <div class="tabs-wrapper" id="tabsWrapper">
        <div class="tabs-header">
            <div class="tabs-scroll-indicators left"></div>
            <div class="tabs-scroll-indicators right"></div>
            <div class="tabs-container" id="tabsContainer">
                <button class="tab-btn active" data-chapter="1">
                    <span class="tab-icon"><i class="fa-solid fa-book-open"></i></span>
                    <span class="tab-label">Introdução</span>
                    <span class="tab-badge">I</span>
                </button>
                <button class="tab-btn" data-chapter="2">
                    <span class="tab-icon"><i class="fa-solid fa-child"></i></span>
                    <span class="tab-label">Abordagem Pediátrica</span>
                    <span class="tab-badge">II</span>
                </button>
                <button class="tab-btn" data-chapter="3">
                    <span class="tab-icon"><i class="fa-solid fa-allergies"></i></span>
                    <span class="tab-label">Alergia</span>
                    <span class="tab-badge">III</span>
                </button>
                <button class="tab-btn" data-chapter="4">
                    <span class="tab-icon"><i class="fa-solid fa-lungs"></i></span>
                    <span class="tab-label">Emerg. Respiratórias</span>
                    <span class="tab-badge">IV</span>
                </button>
                <button class="tab-btn" data-chapter="5">
                    <span class="tab-icon"><i class="fa-solid fa-droplet"></i></span>
                    <span class="tab-label">Desidratação</span>
                    <span class="tab-badge">V</span>
                </button>
                <button class="tab-btn" data-chapter="6">
                    <span class="tab-icon"><i class="fa-solid fa-temperature-high"></i></span>
                    <span class="tab-label">Febre</span>
                    <span class="tab-badge">VI</span>
                </button>
                <button class="tab-btn" data-chapter="7">
                    <span class="tab-icon"><i class="fa-solid fa-wave-square"></i></span>
                    <span class="tab-label">Convulsão</span>
                    <span class="tab-badge">VII</span>
                </button>
                <button class="tab-btn" data-chapter="8">
                    <span class="tab-icon"><i class="fa-solid fa-biohazard"></i></span>
                    <span class="tab-label">Sépsis Meningocócica</span>
                    <span class="tab-badge">VIII</span>
                </button>
                <button class="tab-btn" data-chapter="9">
                    <span class="tab-icon"><i class="fa-solid fa-droplet"></i></span>
                    <span class="tab-label">Hipoglicemia</span>
                    <span class="tab-badge">IX</span>
                </button>
                <button class="tab-btn" data-chapter="10">
                    <span class="tab-icon"><i class="fa-solid fa-skull-crossbones"></i></span>
                    <span class="tab-label">Intoxicação</span>
                    <span class="tab-badge">X</span>
                </button>
                <button class="tab-btn" data-chapter="11">
                    <span class="tab-icon"><i class="fa-solid fa-heartbeat"></i></span>
                    <span class="tab-label">Reanimação</span>
                    <span class="tab-badge">XI</span>
                </button>
            </div>
        </div>
        <div class="tabs-progress">
            <div class="tabs-progress-bar" id="tabsProgress" style="width: 9.09%"></div>
        </div>
    </div>

    <!-- ===== CONTEÚDO DO CAPÍTULO ===== -->
    <div class="chapter-content-wrapper">
        <div class="chapter-content" id="chapterContent">
            <!-- Injetado pelo JavaScript -->
        </div>
    </div>

    <!-- ===== NAVEGAÇÃO ENTRE CAPÍTULOS ===== -->
    <div class="chapter-navigation">
        <button class="nav-btn nav-prev" id="prevChapter" disabled>
            <i class="fa-solid fa-chevron-left"></i>
            <span>Anterior</span>
        </button>
        <div class="nav-indicator">
            <span class="nav-dot active"></span>
            <span class="nav-dot"></span>
            <span class="nav-dot"></span>
            <span class="nav-dot"></span>
            <span class="nav-dot"></span>
            <span class="nav-dot"></span>
            <span class="nav-dot"></span>
            <span class="nav-dot"></span>
            <span class="nav-dot"></span>
            <span class="nav-dot"></span>
            <span class="nav-dot"></span>
        </div>
        <button class="nav-btn nav-next" id="nextChapter">
            <span>Próximo</span>
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>

</main>

<footer class="page-footer">
    <div class="footer-content">
        <p><i class="fa-regular fa-copyright"></i> Estudo TAS - Material de apoio à formação</p>
        <div class="footer-links">
            <span>INEM</span>
            <span>•</span>
            <span>SIEM</span>
            <span>•</span>
            <span>Emergência Médica</span>
        </div>
        <button class="footer-top" id="backToTop" aria-label="Voltar ao topo">
            <i class="fa-solid fa-arrow-up"></i>
        </button>
    </div>
</footer>

<script src="js/EP.js"></script>
</body>
</html>
